[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "max-rh/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Whether to install an updater program
install-updater = false
# Have GitHub attest the built artifacts (provenance for the release assets)
github-attestations = true
# release.yml is hand maintained after generation (SHA-pinned actions, least-privilege
# permissions), so `dist` must not treat those edits as a reason to refuse.
allow-dirty = ["ci"]

# dist 0.32 still picks `macos-14` for Apple silicon, and GitHub retires that image on
# 2026-11-02: capacity is being cut ahead of it, with brownouts from 2026-10-29. The v0.16.3
# build sat queued for 15 minutes twice and was never given a runner, while the Intel job on
# `macos-15-intel` ran in five. Pinned rather than `macos-latest` so a release build does not
# change host under us the way the SHA-pinned actions in release.yml would not.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
