# This file started life as dist output (https://axodotdev.github.io/cargo-dist) and is now
# HAND MAINTAINED. `dist-workspace.toml` sets `allow-dirty = ["ci"]` so dist leaves it alone.
# The edits on top of the generated file are: every action pinned to a commit SHA, read-only
# permissions except on the job that creates the Release, dist downloaded from a pinned URL and
# checked against a sha256 recorded in this file instead of piping an installer script into
# `sh`, every `${{ }}` moved out of `run:` blocks into `env:`, and the container-runner branches
# dropped (no target in dist-workspace.toml uses one, so they were dead code carrying an
# unpinned image and a piped rustup installer).
# To regenerate, drop `allow-dirty` from dist-workspace.toml, run `dist generate`, then
# re-apply all of that. See CONTRIBUTING.md.
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release

# Read-only by default. Only `host` creates the Release, and only `build-local-artifacts`
# signs anything, so those two jobs raise their own permissions.
permissions:
  contents: read

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      # Replaces dist's `curl ... | sh` installer. That script is fetched unverified and is the
      # only thing standing between a swapped GitHub release asset and the binary that builds,
      # packages and attests every artifact we ship. This fetches the same tarball from the same
      # pinned v0.32.0 URL and checks it against a sha256 recorded here, in git, where it gets
      # reviewed. The hashes are the ones cargo-dist-installer.sh v0.32.0 embeds, each one
      # re-derived from the published tarball before being written down. Raising
      # `cargo-dist-version` in dist-workspace.toml means updating this value and the per-target
      # table in build-local-artifacts. This job runs on ubuntu-22.04, so one target covers it.
      - name: Install dist
        shell: bash
        env:
          DIST_VERSION: "0.32.0"
          DIST_TARGET: x86_64-unknown-linux-gnu
          DIST_SHA256: eb52f9fae0d0506774e9f1801c1168f87fa2c87a45e2d64d3ae7c89401929946
        run: |
          set -euo pipefail
          name="cargo-dist-${DIST_TARGET}.tar.xz"
          tmp="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/${name}" \
            -o "${tmp}/${name}"
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "$DIST_SHA256" "${tmp}/${name}" | sha256sum --check --strict -
          else
            printf '%s  %s\n' "$DIST_SHA256" "${tmp}/${name}" | shasum -a 256 --check --strict -
          fi
          tar -xJf "${tmp}/${name}" -C "$tmp" --strip-components=1
          mkdir -p "$HOME/.cargo/bin"
          install -m 755 "${tmp}/dist" "$HOME/.cargo/bin/dist"
          "$HOME/.cargo/bin/dist" --version
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      # The tag reaches the script as a variable, so a ref name can't be read as shell.
      - id: plan
        shell: bash
        env:
          PLAN_TAG: ${{ !github.event.pull_request && github.ref_name || '' }}
        run: |
          set -eo pipefail
          if [ -n "$PLAN_TAG" ]; then
            set -- host --steps=create --tag="$PLAN_TAG"
          else
            set -- plan
          fi
          dist "$@" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      # ssh2-config's build script clones the OpenSSH repo when this is set. sshelf never
      # sets it, and a release build must never reach the network for it.
      - name: Refuse to build with RELOAD_SSH_ALGO set
        run: |
          [ -z "${RELOAD_SSH_ALGO+x}" ] || { echo "::error::RELOAD_SSH_ALGO must not be set"; exit 1; }
      # dist's own `matrix.install_dist.run` is the same piped installer, and it arrives as an
      # expression pasted into `run:`. Same checksum-pinned download as the plan job instead,
      # one row per target in dist-workspace.toml. See the note there; re-derive the hashes
      # when `cargo-dist-version` moves. An unlisted target fails loudly rather than
      # silently falling back to an unverified download.
      - name: Install dist
        shell: bash
        env:
          DIST_VERSION: "0.32.0"
          DIST_TARGET: ${{ matrix.host }}
        run: |
          set -euo pipefail
          case "$DIST_TARGET" in
            aarch64-apple-darwin)
              sha=aa343b2ff78ec2981f17a65140250c5ad6062c74072163f68c5c2686d94763a7 ;;
            aarch64-unknown-linux-gnu)
              sha=d29bcffeb3f8b0c517b4ce0dd2470926ed5cb0bb29d78c6bdd5f88d76ee14a6a ;;
            x86_64-apple-darwin)
              sha=6243464a8389e006b9256ee548bc795638f1a17113c1b6669c0e05ce89fd05c5 ;;
            x86_64-unknown-linux-gnu)
              sha=eb52f9fae0d0506774e9f1801c1168f87fa2c87a45e2d64d3ae7c89401929946 ;;
            *)
              echo "::error::no pinned dist ${DIST_VERSION} checksum for ${DIST_TARGET}"
              exit 1 ;;
          esac
          name="cargo-dist-${DIST_TARGET}.tar.xz"
          tmp="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/${name}" \
            -o "${tmp}/${name}"
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "$sha" "${tmp}/${name}" | sha256sum --check --strict -
          else
            printf '%s  %s\n' "$sha" "${tmp}/${name}" | shasum -a 256 --check --strict -
          fi
          tar -xJf "${tmp}/${name}" -C "$tmp" --strip-components=1
          mkdir -p "$HOME/.cargo/bin"
          install -m 755 "${tmp}/dist" "$HOME/.cargo/bin/dist"
          "$HOME/.cargo/bin/dist" --version
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      # dist emits the system packages declared in dist-workspace.toml here; sshelf declares
      # none, so this is empty today. What dist puts in it is a multi-line shell script, not a
      # command with arguments: `apt-get update` on its own line then `apt-get install ...`, or
      # a `cat <<EOF >Brewfile` heredoc followed by `brew bundle install`. So it has to be fed
      # to a shell. Word-splitting it into an argv would run the first line and drop the rest
      # without an error. It still goes through env: rather than being pasted into `run:`, so
      # GitHub never expands it into the script text; the value comes from dist-workspace.toml,
      # which is part of the repo.
      - name: Install dependencies
        shell: bash
        env:
          PACKAGES_INSTALL: ${{ matrix.packages_install }}
        run: |
          set -eo pipefail
          if [ -n "$PACKAGES_INSTALL" ]; then
            printf '%s\n' "$PACKAGES_INSTALL" | bash -eo pipefail
          fi
      - name: Build artifacts
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: |
          set -eo pipefail
          # Actually do builds and make zips and whatnot
          args=()
          [ -z "$TAG_FLAG" ] || args+=("$TAG_FLAG")
          read -ra dist_args <<<"$DIST_ARGS"
          dist build "${args[@]}" --print=linkage --output-format=json "${dist_args[@]}" > dist-manifest.json
          echo "dist ran successfully"
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "target/distrib/*${{ join(matrix.targets, ', ') }}*"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          set -eo pipefail
          args=()
          [ -z "$TAG_FLAG" ] || args+=("$TAG_FLAG")
          dist build "${args[@]}" --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    # The one job that creates the Release and uploads assets to it.
    permissions:
      contents: write
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          set -eo pipefail
          args=()
          [ -z "$TAG_FLAG" ] || args+=("$TAG_FLAG")
          dist host "${args[@]}" --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        shell: bash
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          RELEASE_TAG: "${{ needs.plan.outputs.tag }}"
        run: |
          set -eo pipefail
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"

          flags=()
          [ -z "$PRERELEASE_FLAG" ] || flags+=("$PRERELEASE_FLAG")
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" "${flags[@]}" \
            --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  publish-homebrew-formula:
    needs:
      - plan
      - host
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      # The credential here belongs to the tap repo, not this one; the job keeps this repo's
      # read-only default.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true
          repository: "max-rh/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # So we have access to the formula
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # This is extra complex because you can make your Formula name not match your app name
      # so we need to find releases with a *.rb file, and publish with that filename.
      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name="${filename%.rb}"
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push

  announce:
    needs:
      - plan
      - host
      - publish-homebrew-formula
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-homebrew-formula.result == 'skipped' || needs.publish-homebrew-formula.result == 'success') }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
