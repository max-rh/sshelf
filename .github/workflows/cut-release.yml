# Cut a release without doing it by hand: bump the version, finalize the changelog, commit, and
# push the tag. Run it from the Actions tab ("Cut release" → enter the version, e.g. 0.4.0).
#
# Pushing the tag fires the dist "Release" workflow (release.yml), which builds the artifacts and
# creates the GitHub Release — with the body taken from this version's CHANGELOG.md section, so
# the release page shows exactly what changed since the previous tag.
#
# NEEDS a `RELEASE_TOKEN` secret, which belongs in the `release` GitHub environment rather than in
# repository secrets: a job that names an environment reads both, so a repository-level copy also
# works, but then every other workflow in the repo can read it too. It is a fine-grained PAT with
# "Contents: read and write" on this repo, owned by someone who can push to `master`. Two reasons
# it must be a PAT, not the default GITHUB_TOKEN: (1) a tag pushed with GITHUB_TOKEN does NOT
# trigger other workflows, so the dist Release would never run; (2) it must bypass branch
# protection on `master`.
#
# The token is deliberately confined to the last step. `actions/checkout` runs with
# `persist-credentials: false`, so the build and test steps run against a tree that carries no
# credential, and the push supplies the PAT in the remote URL for that one command.
name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.4.0 (a leading 'v' is fine)"
        required: true
        type: string

# The push uses RELEASE_TOKEN, so GITHUB_TOKEN never needs write here.
permissions:
  contents: read

jobs:
  cut:
    # Releases are only ever cut from master.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Holds RELEASE_TOKEN, so the secret can be gated on a reviewer and an actor allowlist.
    environment: release
    steps:
      # The dispatch input reaches the shell as a variable, never as text spliced into this
      # script, so metacharacters in it stay inert until the SemVer check has run.
      - name: Normalize + validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="$INPUT_VERSION"; V="${V#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' \
            || { echo "::error::'$V' is not a SemVer version"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history + tags (for the previous tag + pushing)
          persist-credentials: false

      - name: Refuse to re-release an existing tag
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Test before releasing
        run: cargo test --locked

      - name: Bump Cargo.toml + sync Cargo.lock
        run: |
          sed -i -E '0,/^version = ".*"/s//version = "'"$VERSION"'"/' Cargo.toml
          grep -m1 '^version = ' Cargo.toml
          cargo update --workspace # rewrites only the workspace member's version in Cargo.lock

      - name: Finalize CHANGELOG (Unreleased → this version) and refresh compare links
        run: |
          PREV="$(git tag --sort=-v:refname | head -n1)"
          DATE="$(date -u +%Y-%m-%d)"
          python3 - "$VERSION" "$DATE" "$PREV" <<'PY'
          import re, sys, pathlib
          version, date, prev = sys.argv[1], sys.argv[2], sys.argv[3]
          repo = "https://github.com/max-rh/sshelf"
          p = pathlib.Path("CHANGELOG.md")
          text = p.read_text()
          marker = "## [Unreleased]"
          i = text.index(marker) + len(marker)
          # Move the Unreleased items under a new version heading; leave Unreleased empty.
          text = text[:i] + f"\n\n## [{version}] ({date})" + text[i:]
          # Point the Unreleased compare-link at the new tag and add this version's link.
          repl = (
              f"[Unreleased]: {repo}/compare/v{version}...HEAD\n"
              f"[{version}]: {repo}/compare/{prev}...v{version}"
          )
          text = re.sub(r"^\[Unreleased\]:.*$", repl, text, count=1, flags=re.M)
          p.write_text(text)
          PY

      # The only step that sees RELEASE_TOKEN. It goes into the push URL rather than into the
      # repository's git config, so nothing that runs later can read it back out of the tree.
      - name: Commit, tag, and push (the tag triggers the dist Release workflow)
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "max-rh"
          git config user.email "25219094+max-rh@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "release: v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          remote="https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" "HEAD:refs/heads/master"
          git push "$remote" "refs/tags/v$VERSION"
          echo "Pushed v$VERSION — the dist Release workflow will build and publish it." >> "$GITHUB_STEP_SUMMARY"
